version: 2

models:
  - name: mart_expression_summary
    description: "Clean wide-format expression summary."
    columns:
      - name: gene_id
        tests:
          - not_null
          - unique

  - name: mart_full_join
    description: "Final unified dataset including annotation, KEGG, KOG, expression, foldchange, and DEG flag."
    columns:
      - name: gene_id
        tests:
          - not_null
          - unique
      - name: gene_name
      - name: gene_description
      - name: family
      - name: gene_biotype
      - name: kegg_pathway_name
      - name: kog_description
      - name: wt_fpkm
      - name: pdr2_p_fpkm
      - name: pdr3_p_fpkm
      - name: is_deg


