name: 'rna_seq_capstone'
version: '1.0'
config-version: 2

profile: 'rna_seq_profile'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  rna_seq_capstone:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  rna_seq_capstone:
    annotation_raw:
      +column_types:
        Gene_ID: string
